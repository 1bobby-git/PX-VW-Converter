name: Assemble validation assets

on:
  push:
    branches:
      - white-live-css-validation
    paths:
      - .assembly/ready

permissions:
  contents: write

jobs:
  assemble:
    name: Assemble and verify generated JavaScript
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: white-live-css-validation

      - name: Restore JavaScript sources
        run: |
          base64 --decode .assembly/converter-core.js.gz.b64 | gzip --decompress > converter-core.js
          base64 --decode .assembly/app-ui.js.gz.b64 | gzip --decompress > app-ui.js

      - name: Verify generated sources
        run: |
          node --check converter-core.js
          node --check app-ui.js
          node --test tests/*.test.js

      - name: Commit generated sources
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add converter-core.js app-ui.js
          git commit -m "Add live CSS validation and immediate conversion logic"
          git push origin HEAD:white-live-css-validation
